baseURL = 'https://manael.org/'
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
title = 'Manael'


min = "0.160.1"
[[module.imports]]
path = 'github.com/google/docsy/theme'
disable = false

[params]
github_repo = 'https://github.com/manaelproxy/manael'
github_project_repo = 'https://github.com/manaelproxy/manael'
github_branch = 'main'
github_subdir = 'website'
[params.copyright]
authors = 'The Manael Authors'
from_year = 2017
[params.ui]
sidebar_menu_compact = false
navbar_logo = true
sidebar_search_disable = true
showLightDarkModeMenu = true
[params.search.algolia]
appId = "ZX7VYOHRJ3"
apiKey = "43f66f766ffb77ee2280608d793ab235"
indexName = "docusaurus"

[languages]
[languages.en]
label = 'English'
contentDir = 'content/en'
weight = 1
[languages.en.params]
description = 'Manael is a simple HTTP proxy for processing images.'
[languages.ja]
label = '日本語'
contentDir = 'content/ja'
weight = 2
[languages.ja.params]
description = 'Manael は画像を処理するためのシンプルな HTTP プロキシです。'

[[menus.main]]
name = "About"
weight = 10
url = "/about/"

[[menus.main]]
name = "Docs"
weight = 20
url = "/docs/"

[[menus.main]]
name = "Blog"
weight = 30
url = "/blog/"

[security]
allowContent = ['^text/markdown$', '^text/html$']

[security.node.permissions]
allowRead = [".", "../node_modules"]

[markup]
[markup.goldmark]
[markup.goldmark.renderer]
unsafe = false
